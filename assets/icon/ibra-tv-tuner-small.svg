<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>IBRA TV Tuner</title>
  <defs>
    <!-- dark glass tile -->
    <linearGradient id="glass" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1B2A44"/>
      <stop offset="0.55" stop-color="#0E1729"/>
      <stop offset="1" stop-color="#070C18"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DE3FF"/>
      <stop offset="1" stop-color="#22B8F0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect x="40" y="40" width="944" height="944" rx="208"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" fill="url(#glass)"/>
  <g clip-path="url(#tile)">
    <ellipse cx="512" cy="560" rx="420" ry="300" fill="url(#glow)" opacity="0.55"/>
    <path d="M40 40 H984 V420 C760 360 300 380 40 470 Z" fill="url(#sheen)"/>
  </g>
  

  <!-- TV screen with rounded corners -->
  <rect x="150" y="210" width="724" height="540" rx="110" fill="#081222" fill-opacity="0.65" stroke="#4FD3FF" stroke-width="96"/>
  <!-- stand -->
  
  

  <!-- single horizontal tuning slider inside the screen -->
  <path d="M290 480 H734" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="80" stroke-linecap="round"/>
  <path d="M290 480 H560" stroke="#7DE3FF" stroke-width="80" stroke-linecap="round"/>
  <circle cx="580" cy="480" r="110" fill="#FFFFFF"/>
</svg>
